<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClimbMap</title>
<meta name="description" content="Catálogo de competências e acompanhamento pessoal de estudos.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-9 4 5 3-4 5 8z"/><circle cx="17" cy="6" r="2"/></svg>
      </span>
      <span class="brand-name">ClimbMap</span>
    </div>

    <nav class="sidebar-nav" aria-label="Navegação principal">
      <a class="nav-item" href="#inicio" data-route="inicio">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 4l9 6.5"/><path d="M5 10v10h14V10"/></svg>
        <span>Início</span>
      </a>
      <a class="nav-item" href="#catalogo" data-route="catalogo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Catálogo</span>
      </a>
      <a class="nav-item" href="#kanban" data-route="kanban">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="14" rx="1.5"/></svg>
        <span>Kanban</span>
      </a>
      <a class="nav-item" href="#progresso" data-route="progresso">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13"/><path d="M15 7v13"/></svg>
        <span>Meu Progresso</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="nav-item nav-item--button" id="btn-backup">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M4 17v2.5h16V17"/></svg>
        <span>Backup</span>
      </button>
      <p class="sidebar-version">Base V1.0</p>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <button type="button" class="icon-button" id="btn-menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="topbar-title">ClimbMap</span>
    </header>

    <main class="main" id="conteudo" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>

</div>

<div class="scrim" id="sidebar-scrim" hidden></div>

<!-- Drawer de competência -->
<div class="overlay" id="drawer-overlay" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-header">
    <div class="drawer-header-top">
      <div class="badge-row" id="drawer-badges"></div>
      <button type="button" class="icon-button" id="drawer-close" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <h2 class="drawer-title" id="drawer-title"></h2>
    <p class="drawer-context" id="drawer-context"></p>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<!-- Modal genérico -->
<div class="overlay" id="modal-overlay" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="modal-header">
    <h2 class="modal-title" id="modal-title"></h2>
    <button type="button" class="icon-button" id="modal-close" aria-label="Fechar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="modal-body" id="modal-body"></div>
  <div class="modal-footer" id="modal-footer"></div>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

<input type="file" id="backup-file-input" accept="application/json,.json" hidden>

<script src="data/climbmap-v1.0.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/backup.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
